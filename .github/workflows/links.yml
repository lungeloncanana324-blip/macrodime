name: Source links

# Fetches every source link the app shows (DataSources.kt) and every address in
# the Play store description, the way an automated checker would, and fails if
# one does not open. Google Play rejected the second Misleading Claims review on
# 7 Oct 2026 because www.bls.gov turned its link check away with a 403, though
# the page opened in a browser. Running from GitHub's servers is closer to how
# Google fetches a page than a home connection is.
#
# Weekly as well as on change, because a government site can move a page or
# put up a bot filter without anything in this repository changing.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
  push:
    paths:
      - android/core/src/main/kotlin/com/lungelo/macrodime/engine/DataSources.kt
      - docs/play-store-listing.md
      - scripts/check_source_links.py
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every source link
        run: python3 scripts/check_source_links.py
