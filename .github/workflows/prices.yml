name: Refresh food prices

# Pulls the latest public US averages (BLS monthly, USDA ERS yearly) into
# MacroDime/Engine/SourcedPrices.swift, tests the engines against them, and
# commits the file if a price moved. The app itself never fetches a price, so
# this is the only way prices change, and they reach users with the next build.
#
# BLS publishes average prices with the CPI around the middle of the month, so
# this runs on the 20th. Without a BLS_API_KEY secret the script uses BLS API
# v1, whose small daily quota is per IP address and shared with everyone else
# on the runner's address. A free key from
# https://data.bls.gov/registrationEngine/ avoids that.
#
# A commit made with the workflow token does not start other workflows, so the
# engine tests run here, before the commit, rather than in ios.yml after it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 20 * *"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch, test, commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest averages
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 scripts/update_prices.py

      # The generation date changes every run. Only a changed price counts.
      - name: Did any price move?
        id: diff
        run: |
          moved=$(git diff -U0 -- MacroDime/Engine/SourcedPrices.swift \
            | grep -E '^[+-][^+-]' | grep -vE 'GENERATED by|generatedOn' || true)
          if [ -z "$moved" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price moved."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$moved"
          fi

      # Runs even when nothing moved: it is cheap on Linux, and it proves the
      # toolchain is still on the runner before a month when it matters.
      - name: Test the engines against the prices
        run: |
          swift --version
          swift test

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          period=$(sed -n 's/.*static let latestPeriod = "\(.*\)".*/\1/p' MacroDime/Engine/SourcedPrices.swift)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MacroDime/Engine/SourcedPrices.swift
          git commit -m "Refresh sourced food prices to $period"
          git push
