name: Run the app and capture screenshots

# The only place this app has ever been run. A hosted macOS runner boots a
# simulator, installs the build, launches it, checks that it is still alive, and
# captures each tab.
#
# Two jobs in one: it produces the App Store screenshots, and it is the first
# end-to-end test the project has (launching the app is what opens its SwiftData
# store and renders a screen). A crash fails the job and prints the app's own
# stdout and stderr, rather than uploading a black screenshot and calling it a
# success.
#
# Manual trigger only: macOS minutes are the expensive kind, and this is needed
# once or twice per release.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device to shoot on
        required: false
        default: iPhone 16 Pro Max

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Launch the app and capture screenshots
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.lungelo.macrodime
      DEVICE: ${{ github.event.inputs.device || 'iPhone 16 Pro Max' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Boot the simulator
        run: |
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          # Status bar in a fixed, flattering state: 9:41, full battery, full
          # signal. Available since Xcode 15.
          xcrun simctl status_bar "$DEVICE" override \
            --time "09:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project MacroDime.xcodeproj \
            -scheme MacroDime \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install the app
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'MacroDime.app' | head -1)
          test -n "$APP" || { echo "No .app was produced"; exit 1; }
          # CODE_SIGNING_ALLOWED=NO leaves the bundle with no signature at all
          # (the linker signs each binary, but nothing seals the .app). Sign it
          # ad hoc, as a default Xcode simulator build would be, so the build
          # handed to Appetize matches what its docs describe. Needs no
          # certificate or account.
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --verbose=2 "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # Dark appearance: the palette was designed against it.
          xcrun simctl ui "$DEVICE" appearance dark

      # The same ad-hoc signed simulator build, packaged for Appetize, which runs it
      # in a browser so the app can be tapped through without a Mac. Zipped
      # with ditto here, not left to upload-artifact: the artifact zip drops
      # the executable bit, and an .app without it will not launch. Packaged
      # before the launch check so a crash that only happens in screenshot
      # mode still leaves a build to try by hand.
      - name: Package the build for Appetize
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'MacroDime.app' | head -1)
          mkdir -p appetize
          ditto -c -k --sequesterRsrc --keepParent "$APP" appetize/MacroDime.zip
          ls -la appetize

      - name: Upload the Appetize build
        uses: actions/upload-artifact@v4
        with:
          name: appetize-build
          path: appetize/MacroDime.zip
          if-no-files-found: ignore

      # ── The actual first-run test. Launching the app is the only thing that
      #    opens its SwiftData store, seeds the catalogue and renders a screen,
      #    so this step is where a launch crash is caught. A crash would
      #    otherwise produce a black screenshot and a green job.
      - name: Launch, verify it stays alive, and capture every tab
        run: |
          set -euo pipefail
          mkdir -p screenshots logs
          names=("today" "plan" "groceries" "settings")

          for tab in 0 1 2 3; do
            label="${names[$tab]}"
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true

            # --stdout and --stderr put the app's own output in files. If it
            # fatalErrors, the message is here rather than in a crash report
            # nobody reads. The paths must be absolute: the simulator's launchd
            # opens them from its own working directory, /, so a relative
            # "logs/x.out" meant creating /logs on the read-only system volume.
            # That failed the spawn (EROFS), and simctl reported only "denied
            # by service delegate". The first two runs never started the app.
            if ! xcrun simctl launch \
              --stdout="$PWD/logs/${label}.out" \
              --stderr="$PWD/logs/${label}.err" \
              "$DEVICE" "$BUNDLE_ID" -MacroDimeScreenshots -MacroDimeTab "$tab" \
              > "logs/${label}.launch"; then
              echo "::error::The simulator refused to launch $BUNDLE_ID on the $label screen. The app never started, so this is not a crash; the reason is in the simulator log step below."
              exit 1
            fi

            sleep 8

            # Still running? A sheet, a black screen or an empty list is a bug
            # worth looking at, but a dead process is a hard stop. The list is
            # captured before searching it: piped into grep -q under pipefail,
            # grep quits at the first match, launchctl dies of SIGPIPE, and a
            # running app reads as a dead one (run 3 failed Settings that way).
            services=$(xcrun simctl spawn "$DEVICE" launchctl list)
            if ! grep -q "$BUNDLE_ID" <<< "$services"; then
              echo "::error::$BUNDLE_ID died after launch on the $label screen. This is the first-run risk this workflow exists to catch."
              echo "----- app stdout -----"; cat "logs/${label}.out" || true
              echo "----- app stderr -----"; cat "logs/${label}.err" || true
              exit 1
            fi

            xcrun simctl io "$DEVICE" screenshot "screenshots/${label}.png"
            echo "captured ${label}.png ($(cat "logs/${label}.launch"))"
          done

          echo
          echo "----- app stdout from the last launch -----"
          cat logs/settings.out || true
          ls -la screenshots

      - name: Print any crash report
        if: failure()
        run: |
          REPORTS=~/Library/Logs/DiagnosticReports
          found=$(find "$REPORTS" -maxdepth 1 -name '*.ips' -newermt '-15 minutes' 2>/dev/null | head -3)
          if [ -z "$found" ]; then
            echo "No crash report in $REPORTS, so the app did not die of a signal. Check stderr above."
          else
            for file in $found; do
              echo "----- $file -----"
              head -80 "$file"
            done
          fi

      # simctl reports a refused launch only as "denied by service delegate".
      # The reason (signature, missing executable, policy) goes to the
      # simulator's own log, which nobody sees unless it is printed here.
      - name: Print the simulator's log for the app
        if: failure()
        run: |
          xcrun simctl spawn "$DEVICE" log show --style compact --last 15m \
            --predicate 'eventMessage CONTAINS[c] "macrodime"' 2>&1 | tail -120 || true

      - name: Note the pixel sizes
        run: |
          for file in screenshots/*.png; do
            echo "$file: $(sips -g pixelWidth -g pixelHeight "$file" | tail -2 | tr -d ' \n')"
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            screenshots/*.png
            logs/*
          # Warn rather than error: on a failed run the logs are the useful
          # artifact, and the launch step has already failed the job.
          if-no-files-found: warn
