name: Run the app and capture screenshots

# The only place this app has ever been run. A hosted macOS runner boots a
# simulator, installs the build, launches it, checks that it is still alive, and
# captures each tab.
#
# Two jobs in one: it produces the App Store screenshots, and it is the first
# end-to-end test the project has (launching the app is what opens its SwiftData
# store and renders a screen). A crash fails the job and prints the app's own
# stdout and stderr, rather than uploading a black screenshot and calling it a
# success.
#
# Manual trigger only: macOS minutes are the expensive kind, and this is needed
# once or twice per release.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device to shoot on
        required: false
        default: iPhone 16 Pro Max

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Launch the app and capture screenshots
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.lungelo.macrodime
      DEVICE: ${{ github.event.inputs.device || 'iPhone 16 Pro Max' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Boot the simulator
        run: |
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          # Status bar in a fixed, flattering state: 9:41, full battery, full
          # signal. Available since Xcode 15.
          xcrun simctl status_bar "$DEVICE" override \
            --time "09:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project MacroDime.xcodeproj \
            -scheme MacroDime \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install the app
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'MacroDime.app' | head -1)
          test -n "$APP" || { echo "No .app was produced"; exit 1; }
          xcrun simctl install "$DEVICE" "$APP"
          # Dark appearance: the palette was designed against it.
          xcrun simctl ui "$DEVICE" appearance dark

      # ── The actual first-run test. Launching the app is the only thing that
      #    opens its SwiftData store, seeds the catalogue and renders a screen,
      #    so this step is where a launch crash is caught. A crash would
      #    otherwise produce a black screenshot and a green job.
      - name: Launch, verify it stays alive, and capture every tab
        run: |
          set -euo pipefail
          mkdir -p screenshots logs
          names=("today" "plan" "groceries" "settings")

          for tab in 0 1 2 3; do
            label="${names[$tab]}"
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true

            # --stdout and --stderr put the app's own output in files. If it
            # fatalErrors, the message is here rather than in a crash report
            # nobody reads.
            xcrun simctl launch \
              --stdout="logs/${label}.out" \
              --stderr="logs/${label}.err" \
              "$DEVICE" "$BUNDLE_ID" -MacroDimeScreenshots -MacroDimeTab "$tab" \
              > "logs/${label}.launch"

            sleep 8

            # Still running? A sheet, a black screen or an empty list is a bug
            # worth looking at, but a dead process is a hard stop.
            if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
              echo "::error::$BUNDLE_ID died after launch on the $label screen. This is the first-run risk this workflow exists to catch."
              echo "----- app stdout -----"; cat "logs/${label}.out" || true
              echo "----- app stderr -----"; cat "logs/${label}.err" || true
              exit 1
            fi

            xcrun simctl io "$DEVICE" screenshot "screenshots/${label}.png"
            echo "captured ${label}.png ($(cat "logs/${label}.launch"))"
          done

          echo
          echo "----- app stdout from the last launch -----"
          cat logs/settings.out || true
          ls -la screenshots

      - name: Print any crash report
        if: failure()
        run: |
          REPORTS=~/Library/Logs/DiagnosticReports
          found=$(find "$REPORTS" -maxdepth 1 -name '*.ips' -newermt '-15 minutes' 2>/dev/null | head -3)
          if [ -z "$found" ]; then
            echo "No crash report in $REPORTS, so the app did not die of a signal. Check stderr above."
          else
            for file in $found; do
              echo "----- $file -----"
              head -80 "$file"
            done
          fi


      - name: Note the pixel sizes
        run: |
          for file in screenshots/*.png; do
            echo "$file: $(sips -g pixelWidth -g pixelHeight "$file" | tail -2 | tr -d ' \n')"
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            screenshots/*.png
            logs/*
          # Warn rather than error: on a failed run the logs are the useful
          # artifact, and the launch step has already failed the job.
          if-no-files-found: warn
