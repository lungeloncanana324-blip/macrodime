# The Android runtime Robolectric emulates for the app's JVM tests.
#
# API 35 rather than the app's target of 36: Robolectric 4.17's API 36 image
# sets up Android 16's shared memory through java.io.FileDescriptor internals
# that differ on Windows JDKs, and every test fails before it starts. Nothing
# the app does differs between 35 and 36, and the CI emulator job runs the
# real app on API 36.
sdk=35
