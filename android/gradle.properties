# Sized for an 8 GB laptop and a 7 GB CI runner: enough for R8 and Robolectric,
# and leaves room for the emulator.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Two at a time: lint, R8 and dexing in parallel push an 8 GB laptop into swap.
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
