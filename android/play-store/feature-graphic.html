<!doctype html>
<!--
  Source of play-store/feature-graphic.png, the 1024 x 500 banner Play Console
  requires. Rendered by android/scripts/render_feature_graphic.ps1 with headless
  Edge. Every word is HTML text, so it can be edited and re-rendered rather
  than repainted. Play may crop the edges on some surfaces, so nothing that
  matters sits within 40 px of one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacroDime feature graphic</title>
<style>
  :root {
    --gold: #E3B45C;
    --cream: #F3EBDD;
    --muted: #B9AE9A;
  }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #19160F 0%, #0A0906 100%);
    font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    position: relative;
  }
  .glow {
    position: absolute; left: -120px; top: -60px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(227,180,92,0.16) 0%, rgba(227,180,92,0) 62%);
  }
  .mark { position: relative; width: 300px; height: 300px; margin-left: 72px; flex: none; }
  .copy { position: relative; margin-left: 56px; margin-right: 64px; }
  .eyebrow {
    font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 18px;
  }
  h1 { font-size: 56px; line-height: 1.04; margin: 0 0 22px; font-weight: 700; letter-spacing: -0.01em; }
  h1 span { color: var(--gold); }
  .points { display: flex; gap: 22px; font-size: 21px; color: var(--muted); font-weight: 500; }
  .points b { color: var(--cream); font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="mark" src="mark.png" alt="">
  <div class="copy">
    <div class="eyebrow">MacroDime</div>
    <h1>Macros that fit<br><span>your budget</span></h1>
    <div class="points">
      <div><b>Priced</b> meal plans</div>
      <div><b>Cheaper</b> swaps</div>
      <div><b>Grocery</b> lists</div>
    </div>
  </div>
</body>
</html>
