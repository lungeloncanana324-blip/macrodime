<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <a href="{{ '/' | relative_url }}"><img src="{{ '/apple-touch-icon.png' | relative_url }}" width="72" height="72" alt="" style="border-radius: 16px; display: block; margin-bottom: 12px;"></a>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        <p>
          <a href="{{ '/privacy-policy.html' | relative_url }}">Privacy policy</a><br>
          <a href="{{ '/support.html' | relative_url }}">Support</a>
        </p>
      </header>
      <section>
        {{ content }}
      </section>
      <footer>
        <p><small>MacroDime keeps everything you enter on your phone.</small></p>
      </footer>
    </div>
  </body>
</html>
