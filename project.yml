# project.yml — XcodeGen
#
# Generates MacroDime.xcodeproj from this file. It exists because creating an
# Xcode project normally requires a Mac; this is a text file, so the project can
# be defined here and generated on a CI runner instead.
#
# On a macOS machine (or CI runner):
#     brew install xcodegen && xcodegen generate
#
# Never commit the generated .xcodeproj — it is derived from this file.

name: MacroDime

options:
  bundleIdPrefix: com.lungelo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keep generated groups matching the folders on disk.
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode, as the code expects
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  MacroDime:
    type: application
    platform: iOS
    sources:
      # The whole app: Domain, Engine, Persistence, ViewModels, Views, App.
      - path: MacroDime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lungelo.macrodime
        PRODUCT_NAME: MacroDime
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only, for now
        SUPPORTS_MACCATALYST: NO

        # Info.plist is synthesised from build settings rather than kept as a
        # separate file — fewer things to hand-edit without Xcode.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacroDime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

        # REQUIRED: the progress-photo picker hard-crashes without this string.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          MacroDime saves progress photos with your measurements. Photos stay on
          this device and are never uploaded.

  MacroDimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacroDimeTests
    dependencies:
      - target: MacroDime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lungelo.macrodime.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:

  MacroDime:
    build:
      targets:
        MacroDime: all
        MacroDimeTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacroDimeTests
    run:
      config: Debug
